# Tangbuy AI Sourcing (60s) — Shopify app config
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
# Partner dashboard scopes must stay aligned with client_id scopes below and docs/SHOPIFY_APP_LISTING_SCOPES.md

name = "60s Sourcing"
client_id = "a4485f90e92cacc253c7636e12b59abb"
# App origin root. Embedded home `/` is proxied to `/en/install`; post-OAuth
# deep-links use `/en/authorize` under admin.shopify.com/.../apps/{apiKey}/…
application_url = "https://ai.tangbuy.com"
embedded = true

[access_scopes]
scopes = "write_orders,read_orders,write_fulfillments,read_fulfillments,write_shipping,read_shipping,write_products,read_products,write_merchant_managed_fulfillment_orders,read_merchant_managed_fulfillment_orders,read_customer_events,write_marketing_events,read_marketing_events,write_customers,read_customers,read_inventory,write_inventory,read_assigned_fulfillment_orders,write_locations,read_locations,write_assigned_fulfillment_orders"

[auth]
redirect_urls = [
  "https://ai.tangbuy.com/api/plugin/shopify/auth/callback",
  "https://shop-x2mw.onrender.com/api/plugin/shopify/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/plugin/shopify/webhooks"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete"]
  uri = "/api/plugin/shopify/webhooks"

  # GDPR mandatory webhooks (compliance topics)
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/api/plugin/shopify/webhooks/compliance"

[app_proxy]
# Optional later — not required for sourcing workbench v1
# url = "https://ai.tangbuy.com/apps/tangbuy"
# subpath = "tangbuy"
# prefix = "apps"

[pos]
embedded = false
