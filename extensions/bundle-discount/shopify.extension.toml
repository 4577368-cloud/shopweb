api_version = "2024-10"

[[extensions]]
name = "Tangbuy Bundle Discount"
handle = "bundle-discount"
type = "function"
description = "Applies kit / combo percentage discounts from tangbuy_bundle + tangbuy_combo metafields"

  [[extensions.targeting]]
  target = "purchase.product-discount.run"
  input_query = "src/run.graphql"
  export = "run"

  [extensions.build]
  command = "npm run build"
  path = "dist/function.wasm"
  watch = [ "src/**/*.js", "src/**/*.graphql" ]
